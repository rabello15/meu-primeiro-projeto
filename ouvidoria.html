 <head>

<body>
    <h1>Canal de Ouvidoria</h1>

    <label for="detalhes">Descreva a situação:</label><br>
    <textarea id="detalhes" name="detalhes" rows="5" required></textarea><br><br>

    <button type="submit">Registrar Ouvidoria</button>
</form>
